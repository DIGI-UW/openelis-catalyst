name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. Stacked PRs are based
  # on each other, so a `branches: [main]` filter here silently exempts every
  # PR above the bottom of a stack from ever being checked.
  pull_request:
  workflow_dispatch:

jobs:
  test-catalyst:
    name: ${{ matrix.display }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: catalyst-gateway
            display: Gateway
          - project: catalyst-agents
            display: Agents
          - project: catalyst-mcp
            display: MCP
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v5
        with:
          path: ${{ matrix.project }}/.venv
          key: venv-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('${{ matrix.project }}/uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          uv sync --frozen --no-install-project --extra dev

      - name: Check code formatting (Ruff)
        working-directory: ${{ matrix.project }}
        run: |
          uv run ruff format --check .

      - name: Lint code (Ruff)
        working-directory: ${{ matrix.project }}
        run: |
          uv run ruff check .

      - name: Type check (mypy)
        working-directory: ${{ matrix.project }}
        run: |
          uv run mypy src/ || true  # Non-blocking for now

      - name: Run tests
        working-directory: ${{ matrix.project }}
        env:
          PYTHONPATH: ${{ github.workspace }}/${{ matrix.project }}
        run: |
          uv run pytest tests/ -v

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-${{ matrix.project }}
          path: ${{ matrix.project }}/.pytest_cache
          if-no-files-found: ignore

  test-ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalyst-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: catalyst-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser workflow
        run: npx playwright test --project=deterministic

  test-assembly:
    name: MVP assembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run analytics and assembly contract tests
        run: python -m unittest discover -s tests/analytics -p 'test_*.py' -v
