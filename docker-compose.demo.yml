name: catalyst-demo

# Minimal demo stack: no OpenELIS/OpenMRS EMR containers, no fhir-data-pipes
# ingestion. The warehouse is seeded from an already-
# validated local demo stack instead of live FHIR ETL. catalyst-gateway and
# catalyst-ui have no runtime dependency on the EMR layer, only on
# the Spark warehouse + med-agent-hub, so this is the
# full real query path minus the (not-needed-at-runtime) ingestion machinery.

services:
  med-agent-hub:
    restart: unless-stopped
    # The hub is a separate repo, so it builds from a source checkout. Default
    # assumes a sibling clone next to this one (github.com/pmanko/med-agent-hub);
    # set MED_AGENT_HUB_CONTEXT to point elsewhere, e.g. a superproject that
    # vendors it as a submodule.
    #
    # HUB_BUILD_REVISION is required, not cosmetic: the hub validates it at
    # startup and refuses to run on the Dockerfile's "unknown" default, so an
    # image built without it builds cleanly and then exits 1. There is no
    # sensible default to invent here — the value has to name the commit this
    # context is actually checked out at.
    build:
      context: ${MED_AGENT_HUB_CONTEXT:-../med-agent-hub}
      args:
        HUB_BUILD_REVISION: ${MED_AGENT_HUB_REVISION:?set to the 40-character commit SHA of the med-agent-hub checkout, e.g. $(git -C ../med-agent-hub rev-parse HEAD)}
    environment:
      LLM_BASE_URL: "${MVP_EXTERNAL_ROUTER_URL:-http://host.docker.internal:8077}"
      LLM_PROVIDER: "openai-compatible"
      LLM_TEMPERATURE: "0"
      LLM_REQUEST_TIMEOUT_SECONDS: "1800"
      TEAM_TRACE_DIR: /tmp/catalyst-trace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  catalyst-gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: catalyst-gateway/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MED_AGENT_HUB_BASE_URL: "http://med-agent-hub:8080"
      CATALYST_QUERY_PROFILE_ID: "${MVP_QUERY_PROFILE_ID:-catalyst-query-e4b-qwen14b}"
      CATALYST_CONNECTION_URI: "hive2://catalyst@spark-thriftserver:10000/default"
      CATALYST_DIALECT: "spark"
      # No CATALYST_DATA_SOURCES_PATH here: unset means "just the built-in
      # OpenELIS source", which is what makes this stack bootable from a bare
      # clone. Register additional sources by layering
      # docker-compose.demo.extra-sources.yml on top.
      CATALYST_PREVIEW_STORE_PATH: "/app/state/previews.sqlite3"
      CATALYST_QUERY_MAX_ROWS: "100"
      CATALYST_STATEMENT_TIMEOUT_MS: "10000"
      CATALYST_EXECUTION_LEASE_SECONDS: "60"
      CATALYST_HUB_TIMEOUT_SECONDS: "1800"
    volumes:
      - ./docs/contracts:/docs/contracts:ro
      - gateway-state:/app/state
    depends_on:
      spark-thriftserver:
        condition: service_healthy
      med-agent-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  catalyst-ui:
    restart: unless-stopped
    build: ./catalyst-ui
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      catalyst-gateway:
        condition: service_healthy

  # Single edge for all host-facing traffic; catalyst-gateway and catalyst-ui
  # are reached only through here. CATALYST_SITE unset => ":80" (local, plain
  # HTTP, any Host header); set to a domain => automatic Let's Encrypt TLS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CATALYST_SITE: ${CATALYST_SITE:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Demo recordings live on the host, not in git or an image. Read-only:
      # the edge serves them, the deploy is what writes them.
      - "${CATALYST_MEDIA_DIR:-./runtime/media}:/srv/media:ro"
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - catalyst-ui

volumes:
  gateway-state:
  caddy-data:
  caddy-config:
