server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /v1/catalyst/ {
        # Docker may replace the Gateway container without recreating this UI.
        # Resolve the service name at request time instead of retaining its
        # startup IP indefinitely.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $catalyst_gateway http://catalyst-gateway:8000;
        proxy_pass $catalyst_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
