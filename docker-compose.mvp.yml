name: openelis-catalyst-mvp

include:
  - path: .openelis-docker/docker-compose.yml
    project_directory: .openelis-docker
    env_file: .openelis-docker/.env

services:
  certs:
    image: itechuw/certgen@sha256:e27a8194300ba73309e835a4070e9ce531687eb3ee604895de781f3061791635

  db.openelis.org:
    image: itechuw/openelis-global-2-database@sha256:e801c93a8bedc41c2e502722e38585979fbbaf0e92ee4c248cdde72d9c33ec1e

  oe.openelis.org:
    image: itechuw/openelis-global-2@sha256:2217d76104051589d99eb808cef22ae692f6ad2d12a0fadc70ecc549162df36f

  fhir.openelis.org:
    image: itechuw/openelis-global-2-fhir@sha256:667680632b8fe491bb1955f3935751562e60933d3aea91d79256ccd4eac857c3

  superset-metadata-db:
    image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    environment:
      POSTGRES_DB: "${SUPERSET_METADATA_DB:-catalyst_superset_metadata}"
      POSTGRES_USER: "${SUPERSET_METADATA_USER:-catalyst_superset}"
      POSTGRES_PASSWORD: "${SUPERSET_METADATA_PASSWORD:-demo-superset-metadata-change-me}"
    volumes:
      - superset-metadata-data:/var/lib/postgresql/data
    networks:
      - openelis-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -d ${SUPERSET_METADATA_DB:-catalyst_superset_metadata} -U ${SUPERSET_METADATA_USER:-catalyst_superset}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  superset-init:
    image: apache/superset:6.1.0-dev@sha256:5822dff49c41fd745ce33e38af502f9c64df30d133aeba148c5d89b35a1004ef
    platform: "${SUPERSET_PLATFORM:-linux/arm64}"
    command: ["/bin/bash", "/opt/catalyst/superset-init.sh"]
    environment: &superset-environment
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-catalyst-local-demo-secret-key-change-before-shared-use}"
      CATALYST_SUPERSET_METADATA_DSN: "postgresql+psycopg2://${SUPERSET_METADATA_USER:-catalyst_superset}:${SUPERSET_METADATA_PASSWORD:-demo-superset-metadata-change-me}@superset-metadata-db:5432/${SUPERSET_METADATA_DB:-catalyst_superset_metadata}"
      SUPERSET_ADMIN_USERNAME: "${SUPERSET_ADMIN_USERNAME:-admin}"
      SUPERSET_ADMIN_PASSWORD: "${SUPERSET_ADMIN_PASSWORD:-admin}"
      SUPERSET_ADMIN_EMAIL: "${SUPERSET_ADMIN_EMAIL:-admin@catalyst.local}"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./scripts/superset-init.sh:/opt/catalyst/superset-init.sh:ro
      - superset-home:/app/superset_home
    networks:
      - openelis-network
    depends_on:
      superset-metadata-db:
        condition: service_healthy
    restart: "no"

  superset:
    image: apache/superset:6.1.0-dev@sha256:5822dff49c41fd745ce33e38af502f9c64df30d133aeba148c5d89b35a1004ef
    platform: "${SUPERSET_PLATFORM:-linux/arm64}"
    command: ["/app/docker/entrypoints/run-server.sh"]
    environment: *superset-environment
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    networks:
      - openelis-network
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  superset-importer:
    profiles:
      - superset-import
    image: apache/superset:6.1.0-dev@sha256:5822dff49c41fd745ce33e38af502f9c64df30d133aeba148c5d89b35a1004ef
    platform: "${SUPERSET_PLATFORM:-linux/arm64}"
    entrypoint: ["/app/.venv/bin/python", "/opt/catalyst/superset-import.py"]
    command: ["status"]
    environment:
      <<: *superset-environment
      CATALYST_ANALYTICS_DATABASE_URI: "hive://catalyst@spark-thriftserver:10000/default"
      CATALYST_SUPERSET_OUTBOX: /opt/catalyst/outbox
      CATALYST_SUPERSET_RECEIPTS: /opt/catalyst/receipts
      CATALYST_SUPERSET_PUBLIC_URL: "http://localhost:${SUPERSET_PORT:-8088}"
      CATALYST_CONTRACTS_DIR: /docs/contracts
      CATALYST_IMPORTER_REVISION: "${CATALYST_IMPORTER_REVISION:-}"
      CATALYST_SUPERSET_IMAGE_DIGEST: "sha256:5822dff49c41fd745ce33e38af502f9c64df30d133aeba148c5d89b35a1004ef"
      CATALYST_SUPERSET_METADATA_IMAGE_DIGEST: "sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7"
      CATALYST_SUPERSET_PLATFORM: "${SUPERSET_PLATFORM:-linux/arm64}"
      CATALYST_SUPERSET_DRIVER_REVISION: "${SUPERSET_DRIVER_REVISION:-pyhive[hive]==0.7.0}"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./scripts/superset-import.py:/opt/catalyst/superset-import.py:ro
      - ./scripts/superset-import-state.py:/opt/catalyst/superset-import-state.py:ro
      - ./docs/contracts:/docs/contracts:ro
      - ./runtime/superset/outbox:/opt/catalyst/outbox:ro
      - ./runtime/superset/receipts:/opt/catalyst/receipts:rw
      - superset-home:/app/superset_home
    networks:
      - openelis-network
    depends_on:
      superset:
        condition: service_healthy
    restart: "no"

  hapi-mtls-proxy:
    image: catalyst/hapi-mtls-proxy:openelis-3.2.1
    build:
      context: ./analytics/config
      dockerfile: hapi-mtls-proxy.Dockerfile
    command:
      - /bin/sh
      - -ec
      - >-
        openssl pkcs12 -legacy
        -in /etc/openelis-global/client_facing_keystore
        -out /run/hapi-client.pem
        -nodes
        -passin pass:kspass
        && exec nginx -g 'daemon off;'
    volumes:
      - ./analytics/config/hapi-mtls-proxy.conf:/etc/nginx/nginx.conf:ro
      - key_trust-store-volume:/etc/openelis-global:ro
    networks:
      - openelis-network
    depends_on:
      fhir.openelis.org:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:8080/fhir/metadata",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      # A clean HAPI volume builds its initial FHIR indexes before accepting
      # TLS requests. Let that one-time initialization complete before health
      # failures can block FHIR Data Pipes startup.
      start_period: 10m

  fhir-data-pipes:
    image: catalyst/fhir-data-pipes:3ea890884d674e2f31257a2da421601f2d75b5e9
    restart: "on-failure:10"
    build:
      context: ./.fhir-data-pipes
      dockerfile: Dockerfile
    environment:
      JAVA_OPTS: >-
        -Xms512m
        -Xmx${DATA_PIPES_MAX_HEAP:-2g}
        -Djavax.net.ssl.trustStore=/etc/openelis-global/truststore
        -Djavax.net.ssl.trustStorePassword=tspass
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.keyStore=/etc/openelis-global/client_facing_keystore
        -Djavax.net.ssl.keyStorePassword=kspass
        -Djavax.net.ssl.keyStoreType=PKCS12
      FHIRDATA_GENERATEPARQUETFILES: "true"
      FHIRDATA_CREATEHIVERESOURCETABLES: "true"
      FHIRDATA_CREATEPARQUETVIEWS: "true"
      FHIRDATA_THRIFTSERVERHIVECONFIG: "config/thriftserver-hive-config.json"
      FHIRDATA_NUMTHREADS: "1"
    ports:
      - "127.0.0.1:${DATA_PIPES_PORT:-8090}:8080"
    volumes:
      - ./analytics/config:/app/config:ro
      # Upstream's compose-controller-spark-sql-single.yaml shares the warehouse
      # at /dwh, and the controller registers absolute Parquet locations into
      # the Hive metastore. The thriftserver must therefore mount this volume at
      # the identical path, or the registered views resolve to nothing and
      # queries return zero rows against a warehouse that looks healthy.
      - data-pipes-dwh:/dwh
      - key_trust-store-volume:/etc/openelis-global:ro
    networks:
      - openelis-network
    depends_on:
      spark-thriftserver:
        condition: service_healthy
      hapi-mtls-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/actuator/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Upstream's single-process Spark SQL environment, copied from
  # .fhir-data-pipes/docker/compose-controller-spark-sql-single.yaml at the
  # pinned revision. It reads the Parquet the controller writes and serves it
  # over Hive Thrift; Catalyst and Superset are ordinary SQL clients of it.
  spark-thriftserver:
    image: docker.io/bitnamilegacy/spark:4.0.0
    restart: unless-stopped
    command:
      - sbin/start-thriftserver.sh
      - --driver-memory
      - "${SPARK_DRIVER_MEMORY:-5g}"
    environment:
      HIVE_SERVER2_THRIFT_PORT: "10000"
    ports:
      - "127.0.0.1:${SPARK_THRIFT_PORT:-10001}:10000"
    volumes:
      - data-pipes-dwh:/dwh
      # The embedded Derby metastore lives under the Spark install; persisting
      # it is what keeps registered tables and views across a restart.
      - spark-thriftserver-home:/opt/bitnami/spark
    networks:
      - openelis-network
    healthcheck:
      test: ["CMD-SHELL", "beeline help || exit 1"]
      interval: 10s
      retries: 10
      start_period: 5s
      timeout: 60s

  med-agent-hub:
    # Survives a daemon restart or an OrbStack reboot: these four were the
    # only long-lived services here without a policy, so a reboot left the
    # stack half-up (the OpenELIS and Superset services inherit one from
    # their own compose file). One-shot jobs keep restart: "no" on purpose.
    restart: unless-stopped
    build:
      context: "${MED_AGENT_HUB_CONTEXT:-./.med-agent-hub}"
      args:
        HUB_BUILD_REVISION: "${HUB_BUILD_REVISION:-unknown}"
    ports:
      - "127.0.0.1:${MED_AGENT_HUB_PORT:-8082}:8080"
    environment:
      LLM_BASE_URL: "${MVP_SELECTED_ROUTER_URL:-http://host.docker.internal:8077}"
      LLM_PROVIDER: "${HUB_LLM_PROVIDER:-openai-compatible}"
      LLM_API_KEY: "${HUB_LLM_API_KEY:-}"
      LLM_TEMPERATURE: "0"
      TEAM_TRACE_DIR: /tmp/catalyst-trace
      QUERYSTORE_BASE_URL: "${QUERYSTORE_BASE_URL:-}"
      QUERYSTORE_USERNAME: "${QUERYSTORE_USERNAME:-}"
      QUERYSTORE_PASSWORD: "${QUERYSTORE_PASSWORD:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - openelis-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  catalyst-gateway:
    # Survives a daemon restart or an OrbStack reboot: these four were the
    # only long-lived services here without a policy, so a reboot left the
    # stack half-up (the OpenELIS and Superset services inherit one from
    # their own compose file). One-shot jobs keep restart: "no" on purpose.
    restart: unless-stopped
    build:
      context: .
      dockerfile: catalyst-gateway/Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    environment:
      MED_AGENT_HUB_BASE_URL: "http://med-agent-hub:8080"
      CATALYST_QUERY_PROFILE_ID: "${MVP_RESOLVED_PROFILE_ID:-catalyst-query-e4b-qwen14b}"
      CATALYST_CONNECTION_URI: "hive2://catalyst@spark-thriftserver:10000/default"
      CATALYST_DIALECT: "spark"
      CATALYST_PREVIEW_STORE_PATH: "/app/state/previews.sqlite3"
      CATALYST_SUPERSET_OUTBOX: "/app/superset-outbox"
      CATALYST_SUPERSET_RECEIPTS: "/app/superset-receipts"
      CATALYST_SUPERSET_ANALYTICS_URI: "hive://catalyst@spark-thriftserver:10000/default"
      CATALYST_QUERY_MAX_ROWS: "${CATALYST_QUERY_MAX_ROWS:-100}"
      CATALYST_STATEMENT_TIMEOUT_MS: "${CATALYST_STATEMENT_TIMEOUT_MS:-10000}"
      CATALYST_EXECUTION_LEASE_SECONDS: "${CATALYST_EXECUTION_LEASE_SECONDS:-60}"
      CATALYST_HUB_TIMEOUT_SECONDS: "${CATALYST_HUB_TIMEOUT_SECONDS:-360}"
    volumes:
      - ./docs/contracts:/docs/contracts:ro
      - gateway-state:/app/state
      - ./runtime/superset/outbox:/app/superset-outbox
      - ./runtime/superset/receipts:/app/superset-receipts:ro
    networks:
      - openelis-network
    depends_on:
      spark-thriftserver:
        condition: service_healthy
      med-agent-hub:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  catalyst-ui:
    # Survives a daemon restart or an OrbStack reboot: these four were the
    # only long-lived services here without a policy, so a reboot left the
    # stack half-up (the OpenELIS and Superset services inherit one from
    # their own compose file). One-shot jobs keep restart: "no" on purpose.
    restart: unless-stopped
    build: ./catalyst-ui
    ports:
      - "127.0.0.1:${CATALYST_UI_PORT:-3000}:8080"
    networks:
      - openelis-network
    depends_on:
      catalyst-gateway:
        condition: service_healthy

volumes:
  data-pipes-dwh:
  spark-thriftserver-home:
  gateway-state:
  superset-metadata-data:
  superset-home:
